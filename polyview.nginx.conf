# PolyView - Nginx reverse proxy config
# File ini: /etc/nginx/sites-available/polyview
#
# Cara pakai:
#   sudo cp polyview.nginx.conf /etc/nginx/sites-available/polyview
#   sudo ln -s /etc/nginx/sites-available/polyview /etc/nginx/sites-enabled/polyview
#   sudo nginx -t
#   sudo systemctl reload nginx

server {
    listen 8080;
    server_name _;           # terima semua hostname / IP

    # Ukuran upload max (untuk file 3D besar)
    client_max_body_size 500M;

    # Timeout lebih lama untuk file besar
    proxy_read_timeout    300s;
    proxy_connect_timeout 60s;
    proxy_send_timeout    300s;

    location / {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Nonaktifkan buffering untuk file besar (download langsung streaming)
        proxy_buffering    off;
        proxy_request_buffering off;
    }

    # Service Worker — wajib no-cache + header scope
    location = /sw.js {
        proxy_pass http://127.0.0.1:5000;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Service-Worker-Allowed "/";
    }

    # manifest PWA
    location = /manifest.json {
        proxy_pass http://127.0.0.1:5000;
        add_header Cache-Control "public, max-age=3600";
    }

    # Cache static assets lain (opsional)
    location ~* \.(css|woff2?)$ {
        proxy_pass http://127.0.0.1:5000;
        add_header Cache-Control "public, max-age=86400";
    }
}
