services:
  polyview:
    build:
      context: .
      args:
        PUID: ${PUID:-1000}
        PGID: ${PGID:-1000}
    image: polyview:latest
    container_name: polyview
    environment:
      POLYVIEW_DATA_DIR: /data
      GUNICORN_WORKERS: 2
      GUNICORN_TIMEOUT: 300
    volumes:
      # Development default: ./database3d. Production: set POLYVIEW_HOST_DATA_DIR di .env
      - ./database3d:/data:ro
    expose:
      - "5000"
    # healthcheck (/healthz) didefinisikan di Dockerfile
    restart: unless-stopped
    mem_limit: 6G
    cpus: "1.0"

  nginx:
    image: nginx:latest
    container_name: polyview-nginx
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx/polyview.conf:/etc/nginx/conf.d/default.conf:ro
      - ./static:/srv/polyview/static:ro
    depends_on:
      polyview:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
    restart: unless-stopped
    mem_limit: 0.5G
    cpus: "0.5"
